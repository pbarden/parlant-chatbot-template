# Example GitHub Actions workflow skeleton (fill in registry details)
name: deploy
on:
  push:
    branches: [main]
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build API image
        run: |
          docker build -t ghcr.io/YOUR_COMPANY/parlant-api:latest backend
          docker push ghcr.io/YOUR_COMPANY/parlant-api:latest