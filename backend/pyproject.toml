[project]
name = "parlant-chatbot-template"
version = "0.1.0"
description = "FastAPI backend template for Parlant-powered chatbots (multi-tenant)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.2",
  "pyjwt>=2.9",
  "prometheus-client>=0.20",
  "orjson>=3.10",
  "structlog>=24.1",
  "async-exit-stack>=1.0.1",
  "async-generator>=1.10",
]

[tool.uvicorn]
factory = true
port = 8000
host = "0.0.0.0"
workers = 2

[tool.black]
line-length = 100

[tool.isort]
profile = "black"